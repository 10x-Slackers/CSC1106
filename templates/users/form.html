{% extends "partials/form_page.html" %}

{% block form_fields %}
  <label class="label" for="name">Name</label>
  <input
    type="text"
    id="name"
    name="name"
    value="{% if user %}{{ user.name }}{% endif %}"
    class="input w-full"
    required
  />

  <label class="label" for="email">Email</label>
  <input
    type="email"
    id="email"
    name="email"
    value="{% if user %}{{ user.email }}{% endif %}"
    class="input w-full"
    required
  />

  <label class="label" for="role">Role</label>
  <select
    id="role"
    name="role"
    class="select w-full"
    {% if mode == "edit" and user.id == current_user.id %}disabled{% endif %}
  >
    <option
      value="Staff"
      {% if user and user.role == "Staff" %}selected{% endif %}
    >
      Staff
    </option>
    <option
      value="Accountant"
      {% if user and user.role == "Accountant" %}selected{% endif %}
    >
      Accountant
    </option>
    <option
      value="Admin"
      {% if user and user.role == "Admin" %}selected{% endif %}
    >
      Admin
    </option>
  </select>
  {% if mode == "edit" and user.id == current_user.id %}
    <p class="label">You cannot change your own role.</p>
  {% endif %}

  <label class="label" for="password">
    {% if mode == "create" %}
      Password
    {% else %}
      New password (leave blank to keep current)
    {% endif %}
  </label>
  <input
    type="password"
    id="password"
    name="password"
    class="input w-full"
    {% if mode == "create" %}required{% endif %}
  />
{% endblock %}
