{% extends "partials/layout.html" %}

{% block title %}{{ mode | capitalize }} Party{% endblock %}
{% block page_content %}
  <div class="mx-auto max-w-lg">
    <div class="card card-border">
      <div class="card-body">
        <h2 class="card-title justify-center text-2xl">
          {{ mode | capitalize }} Party
        </h2>

        {% if message != "" %}
          <div
            role="alert"
            class="alert {% if message_kind == "success" %}alert-success{% else %}alert-error{% endif %}"
          >
            <span>{{ message }}</span>
          </div>
        {% endif %}

        <form
          action="{% if mode == "edit" %}/parties/{{ party.id }}{% else %}/parties{% endif %}"
          method="post"
        >
          <fieldset class="fieldset">
            <label class="label" for="name">Name</label>
            <input
              type="text"
              id="name"
              name="name"
              value="{% if form.name is defined %}{{ form.name }}{% elif party is defined %}{{ party.name }}{% endif %}"
              class="input w-full"
              required
            />

            <label class="label" for="company">Company</label>
            <input
              type="text"
              id="company"
              name="company"
              value="{% if form.company is defined %}{{ form.company }}{% elif party is defined %}{{ party.company }}{% endif %}"
              placeholder="Optional"
              class="input w-full"
            />

            <label class="label" for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              value="{% if form.email is defined %}{{ form.email }}{% elif party is defined %}{{ party.email }}{% endif %}"
              class="input w-full"
              required
            />

            <label class="label" for="phone">Phone</label>
            <input
              type="text"
              id="phone"
              name="phone"
              value="{% if form.phone is defined %}{{ form.phone }}{% elif party is defined %}{{ party.phone }}{% endif %}"
              class="input w-full"
              required
            />

            <label class="label" for="address">Address</label>
            <textarea
              id="address"
              name="address"
              class="textarea w-full"
              required
            >
{% if form.address is defined %}{{ form.address }}{% elif party is defined %}{{ party.address }}{% endif %}</textarea
            >

            <label class="label" for="party_type">Party Type</label>
            <select
              id="party_type"
              name="party_type"
              class="select w-full"
              required
            >
              {% if form.party_type is defined %}
                {% set current_party_type = form.party_type %}
              {% elif party is defined %}
                {% set current_party_type = party.party_type %}
              {% else %}
                {% set current_party_type = "" %}
              {% endif %}
              <option
                value="Customer"
                {% if current_party_type == "Customer" %}selected{% endif %}
              >
                Customer
              </option>
              <option
                value="Vendor"
                {% if current_party_type == "Vendor" %}selected{% endif %}
              >
                Vendor
              </option>
            </select>

            <div class="mt-4 flex gap-2">
              <button type="submit" class="btn btn-primary">
                {% if mode == "create" %}Create Party{% else %}Save Changes{% endif %}
              </button>
              <a href="/parties" class="btn btn-ghost">Cancel</a>
            </div>
          </fieldset>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
